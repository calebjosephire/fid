<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DIY Mechanics – Fix My Car</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  padding: 0;
  background: #0f172a;
  color: #e5e7eb;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
}

.app-container {
  width: 100%;
  max-width: 900px;
  padding: 24px;
}

.card {
  background: #111827;
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 20px 40px rgba(0,0,0,.4);
  border: 1px solid #1f2937;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}

.title-block h1 {
  margin: 0;
}

.title-block p {
  color: #9ca3af;
}

.badge {
  padding: 6px 12px;
  border-radius: 999px;
  background: #1d4ed8;
  font-size: 12px;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
  gap: 16px;
  margin-bottom: 20px;
}

.field label {
  display: block;
  margin-bottom: 4px;
  color: #9ca3af;
}

.field input,
.field select,
.field textarea {
  width: 100%;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid #374151;
  background: #020617;
  color: #e5e7eb;
}

.field textarea {
  min-height: 60px;
}

.actions {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  margin-bottom: 20px;
}

.btn {
  padding: 10px 16px;
  border-radius: 999px;
  border: none;
  cursor: pointer;
}

.btn-secondary {
  background: transparent;
  color: #9ca3af;
  border: 1px solid #374151;
}

.btn-primary {
  background: #22c55e;
  color: #022c22;
}

.results {
  border-top: 1px solid #1f2937;
  padding-top: 16px;
  margin-top: 20px;
}

.video-list {
  display: grid;
  gap: 12px;
}

.video-card {
  background: #020617;
  border-radius: 12px;
  padding: 12px;
  border: 1px solid #1f2937;
}

.video-link {
  color: #22c55e;
}

.sr-only {
  position: absolute;
  left: -10000px;
  width: 1px;
  height: 1px;
  overflow: hidden;
}
</style>
</head>

<body>

<div class="app-container">
  <div class="card">

    <div class="header">
      <div class="title-block">
        <h1>DIY Mechanics – Fix My Car</h1>
        <p>Enter your car details and issue to get targeted repair video ideas.</p>
      </div>
      <div class="badge">HTML Prototype</div>
    </div>

    <div class="form-grid">

      <div class="field">
        <label for="year">Year</label>
        <input
          id="year"
          type="number"
          min="1900"
          max="2030"
          placeholder="e.g. 2015"
          aria-describedby="year-announcement">
        <div id="year-announcement" class="sr-only" aria-live="polite"></div>
      </div>

      <div class="field">
        <label for="make">Make</label>
        <input id="make" type="text" placeholder="e.g. Toyota">
      </div>

      <div class="field">
        <label for="model">Model</label>
        <input id="model" type="text" placeholder="e.g. Camry">
      </div>

  <div class="field">
  <label for="issue">Main Issue</label>
  <select
    id="issue"
    aria-describedby="issue-announcement">
    <option value="">Select an issue</option>
    <option value="won't start">Car won't start</option>
    <option value="check engine light">Check engine light</option>
    <option value="brakes">Brake noise or issues</option>
    <option value="oil leak">Oil leak</option>
    <option value="overheating">Overheating</option>
    <option value="battery">Battery / electrical</option>
  </select>

<div
  id="issue-announcement"
  class="sr-only"
  aria-live="assertive"
  aria-atomic="true">
</div>
</div>

    <div class="field">
      <label for="details">Describe the problem</label>
      <textarea id="details"
        placeholder="Any sounds, smells, or when it happens (cold start, highway, etc.)"></textarea>
    </div>

    <div class="actions">
      <button class="btn btn-secondary" onclick="clearForm()">Clear</button>
      <button class="btn btn-primary" onclick="getRecommendations()">Get Recommendations</button>
    </div>

    <div class="results">
      <h2>Recommended Videos</h2>
      <p id="results-intro">
        Fill out the form and click "Get Recommendations" to see suggested video topics.
      </p>
      <div id="video-list" class="video-list"></div>
    </div>

  </div>
</div>

<script>

const yearInput = document.getElementById('year');
const yearAnnouncement = document.getElementById('year-announcement');

yearInput.addEventListener('input', function () {
  if (this.value) {
    yearAnnouncement.textContent =
      `Selected year ${this.value}`;
  }
});

const issueSelect = document.getElementById('issue');
const issueAnnouncement = document.getElementById('issue-announcement');

function announceIssue() {
  const selectedText =
    issueSelect.options[issueSelect.selectedIndex].text;

  issueAnnouncement.textContent = '';

  setTimeout(() => {
    issueAnnouncement.textContent =
      `Main issue: ${selectedText}`;
  }, 50);
}

issueSelect.addEventListener('change', announceIssue);
issueSelect.addEventListener('keyup', announceIssue);

issueSelect.addEventListener('keydown', function () {
  setTimeout(announceIssue, 50);
});


function clearForm() {
  document.getElementById('year').value = '';
  document.getElementById('make').value = '';
  document.getElementById('model').value = '';
  document.getElementById('issue').value = '';
  document.getElementById('details').value = '';
  document.getElementById('video-list').innerHTML = '';
  document.getElementById('results-intro').textContent =
    'Fill out the form and click "Get Recommendations" to see suggested video topics.';
}

function getRecommendations() {

  const year = document.getElementById('year').value.trim();
  const make = document.getElementById('make').value.trim();
  const model = document.getElementById('model').value.trim();
  const issue = document.getElementById('issue').value;

  const intro = document.getElementById('results-intro');
  const videoList = document.getElementById('video-list');

  videoList.innerHTML = '';

  if (!year || !make || !model || !issue) {
    intro.textContent =
      'Please fill in year, make, model and main issue.';
    return;
  }

  intro.textContent =
    `Here are some video ideas for a ${year} ${make} ${model}.`;

  const card = document.createElement('div');
  card.className = 'video-card';
  card.innerHTML = `
    <strong>${issue} repair tutorial</strong><br>
    Suggested DIY repair videos for your vehicle.
  `;

  videoList.appendChild(card);
}

</script>

</body>
</html>
