    <h1 id="myHeader"><strong>Family Christian Academy Soccer</strong></h1>

    <p><img src="DSC09960.JPG" width="800px"  style="vertical-align: middle;"></p>

<body>
    <h2>Sign Up!</h2>

<form>
  <label for="fname">First Name</label>
  <input type="text" id="fname" name="fname">
  <label for="lname">Last Name</label>
  <input type="text" id="lname" name="lname">
</form>
<form>
  <label for="lname">Date of Birth</label>
  <input type="text" id="dob" name="dob">
</form>
<h4>Address:</h4>
<form>
      <label for="lname"></label>
  <input type="text" id="Add" name="Add"
  placeholder="Street Address">
        <label for="lname"></label>
  <input type="text" id="Add" name="Add"
  placeholder="Street Address Line 2">
        <label for="lname"></label>
  <input type="text" id="Add" name="Add"
  placeholder="City">
        <label for="lname"></label>
  <input type="text" id="Add" name="Add"
  placeholder="State">
        <label for="lname"></label>
  <input type="text" id="Add" name="Add"
  placeholder="Postal/Zip Code">
</form>
<form>
      <label for="Exp">Experience</label>
  <input type="text" id="Exp" name="Exp"
  placeholder="Tell us about yourself">
</form>

<h3>Year:</h3>
<form>
  <select id="Year" name="Year">
  <option value="Fr">Freshman</option>
  <option value="So">Sophomore</option>
  <option value="Jr">Junior</option>
  <option value="Sr">Senior</option>
  </select>
</form>

<h3>Position:</h3>
<form>
  <select id="position" name="position">
  <option value="St">Striker</option>
  <option value="Wi">Wing</option>
  <option value="Mf">Midfield</option>
  <option value="Def">Defense</option>
  <option value="Go">Goalie</option>
  </select>
</form>

<h3>Dominant Foot:</h3>
<form>
  <select id="foot" name="foot">
  <option value="L">Left</option>
  <option value="R">Right</option>
  </select>
</form>
